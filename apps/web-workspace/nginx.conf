# ============================================
# Nginx config for app.eventflow.uz (SPA)
# ============================================
# Скопируй на сервер:
# sudo cp nginx.conf /etc/nginx/sites-available/app.eventflow.uz
# sudo ln -sf /etc/nginx/sites-available/app.eventflow.uz /etc/nginx/sites-enabled/
# sudo certbot --nginx -d app.eventflow.uz
# sudo nginx -t && sudo systemctl reload nginx
# ============================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.eventflow.uz;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.eventflow.uz;

    # SSL сертификаты (certbot настроит автоматически)
    ssl_certificate /etc/letsencrypt/live/app.eventflow.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eventflow.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Корневая директория
    root /var/www/app.eventflow.uz;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # Кэширование статики (1 год для хэшированных файлов)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback - все запросы на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Логи
    access_log /var/log/nginx/app.eventflow.uz.access.log;
    error_log /var/log/nginx/app.eventflow.uz.error.log;
}
